<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KL & Selangor Weekend Events</title>
<style>
:root{color-scheme:light;--ink:#202938;--muted:#667085;--line:#e5e7eb;--accent:#3157a4}
*{box-sizing:border-box}body{margin:0;background:#f5f7fb;color:var(--ink);font-family:Arial,"Noto Sans KR",sans-serif;line-height:1.6}
header{background:#172554;color:#fff;padding:32px 18px}header .wrap,main,footer{max-width:900px;margin:auto}
h1{margin:0 0 8px;font-size:clamp(26px,5vw,38px)}header p{margin:0;color:#dbeafe}
main{padding:22px 16px 50px}.notice{background:#fff;border:1px solid var(--line);border-radius:14px;padding:20px;margin:0 0 18px}
h2{font-size:22px;margin:0 0 12px}.muted{color:var(--muted)}.event{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px;margin:12px 0}
.event h3{margin:0 0 7px;font-size:18px}.meta{font-size:14px;color:var(--muted);margin-bottom:8px}
a{color:var(--accent);overflow-wrap:anywhere}.pill{display:inline-block;background:#eef2ff;color:#3730a3;border-radius:20px;padding:3px 10px;font-size:12px;margin-bottom:8px}
footer{padding:20px 16px 35px;color:var(--muted);font-size:13px}
</style>
</head>
<body>
<header><div class="wrap"><h1>KL & Selangor Weekend Events</h1><p>쿠알라룸푸르·셀랑고르 주말 행사 안내</p></div></header>
<main>
<section class="notice"><h2>이번 주말 행사 안내</h2><p class="muted">아직 첫 자동 업데이트 전입니다. 자동화 설정이 완료되면 행사, 가족·키즈 체험, 인스타그램 행사 및 공휴일 정보가 이 페이지에 업데이트됩니다.</p><p class="muted">행사 일정은 변경될 수 있으므로 방문 전 주최 측의 공식 안내를 확인해 주세요.</p></section>
<section class="notice"><h2>행사 정보</h2><p>자동 업데이트 대기 중입니다.</p></section>
</main>
<footer>KL & Selangor Weekend Events · 행사 정보는 공개된 출처를 바탕으로 제공되며 방문 전 주최 측 안내를 확인해 주세요.</footer>
</body></html>
